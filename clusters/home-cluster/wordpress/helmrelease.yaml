apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wordpress
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: wordpress
      version: 19.2.7        # or latest stable from Bitnami
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    service:
      type: NodePort
      nodePorts:
        http: 30080          # change if needed
    wordpressUsername: admin
    wordpressPassword: changeme123
    wordpressEmail: admin@example.com
    wordpressBlogName: "My Flux WordPress"
    mariadb:
      enabled: true
      auth:
        rootPassword: rootpass123
        password: wpdbpass123
    persistence:
      enabled: true
      size: 8Gi
    mariadb.primary.persistence:
      enabled: true
      size: 8Gi
